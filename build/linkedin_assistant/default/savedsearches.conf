[LinkedIn Assistant - reconcile imports]
search = `li_reconcile` | search NOT [ search index=linkedin sourcetype=linkedin:ready earliest=0 latest=+10y | where event_kind="ready" | dedup member_id export_id | fields member_id export_id ] | eval _raw=json_object("event_time",now(),"event_kind","ready","status",if(warning_count>0,"ready_with_warnings","ready"),"member_id",member_id,"export_id",export_id,"import_epoch",import_epoch,"snapshot_time",snapshot_time,"snapshot_time_basis","import_observed","expected_records",expected,"actual_records",actual,"warning_count",warning_count) | fields _raw | collect index=linkedin sourcetype=linkedin:ready addtime=false addinfo=false
cron_schedule = * * * * *
enableSched = 1
disabled = 0
is_visible = 0
dispatch.earliest_time = 0
dispatch.latest_time = +10y
dispatch.ttl = 120
realtime_schedule = 0
schedule_window = auto
