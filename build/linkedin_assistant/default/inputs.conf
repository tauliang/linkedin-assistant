# Single-instance Enterprise defaults. Disable worker and monitors on search-only nodes.
[script://$SPLUNK_HOME/etc/apps/linkedin_assistant/bin/linkedin_zip_worker.py]
disabled = 0
interval = 30
python.version = python3.9
python.required = 3.9,3.13
index = linkedin
sourcetype = linkedin:worker
source = linkedin_assistant:worker

[monitor://$SPLUNK_HOME/var/lib/linkedin_assistant/spool/ad_targeting]
disabled = 0
recursive = false
whitelist = \.json$
index = linkedin
sourcetype = linkedin:ad_targeting
crcSalt = <SOURCE>

