[li_reconcile]
definition = index=linkedin sourcetype=linkedin:* earliest=0 latest=+10y | where event_kind="record" OR event_kind="manifest" | stats dc(eval(if(event_kind="record",event_id,null()))) AS actual max(eval(if(event_kind="manifest",expected_records,null()))) AS expected max(expected_dataset_count) AS expected_dataset_count max(import_epoch) AS import_epoch max(warning_count) AS warning_count max(snapshot_time) AS snapshot_time BY member_id export_id dataset | fillnull value=0 actual | eval matched=if(isnotnull(expected) AND actual=expected,1,0) | stats dc(dataset) AS datasets_seen min(matched) AS reconciled sum(actual) AS actual sum(expected) AS expected max(expected_dataset_count) AS expected_dataset_count max(import_epoch) AS import_epoch max(warning_count) AS warning_count max(snapshot_time) AS snapshot_time BY member_id export_id | where reconciled=1 AND datasets_seen=expected_dataset_count
iseval = 0

[li_records]
definition = index=linkedin sourcetype=linkedin:* earliest=0 latest=now | where event_kind="record" | dedup event_id
iseval = 0
